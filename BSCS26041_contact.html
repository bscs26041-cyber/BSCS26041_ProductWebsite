<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="BSCS26041_style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-links">
            <a href="bscs26041_home.html" class="nav-btn">HOME</a>
            <a href="BSCS26041_product.html" class="nav-btn">PRODUCTS</a>
            <a href="BSCS26041_contact.html" class="nav-btn active">ABOUT US</a>
        </div>
    </header>

    <main class="contact-container">
        <section class="contact-box">
            <h1>Contact Details</h1>
            <div class="contact-info">
                <p><strong>Cell Number:</strong> 0300-1111111</p>
                <p><strong>Email:</strong> info@motherspolish.com</p>
                <p><strong>Location:</strong> </p>
            </div>
            <div class="social-media">
                <h3>Connect With Us</h3>
                <div class="social-buttons">
                    <a href="https://facebook.com" target="_blank" class="social-btn facebook">
                        <img src="Facebook_logo.png" alt="Facebook Logo" class="social-icon">
                        <span>Facebook</span>
                    </a>          
                    <a href="https://instagram.com" target="_blank" class="social-btn instagram">
                        <img src="Instagram_logo.webp" alt="Instagram Logo" class="social-icon">
                        <span>Instagram</span>
                    </a>
                    <a href="https://linkedin.com" target="_blank" class="social-btn linkedin">
                        <img src="linkedin-logo.webp" alt="LinkedIn Logo" class="social-icon">
                        <span>LinkedIn</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- ADDED FOR THE LAB: Contact Form Section -->
        <section class="contact-box form-box">
            <h2>Send a Message</h2>
            <form>
                <div class="form-group">
                    <label for="userName">Name:</label>
                    <input type="text" id="userName" name="name" required placeholder="Your Name">
                </div>
                
                <div class="form-group">
                    <label for="userEmail">Email:</label>
                    <input type="email" id="userEmail" name="email" required placeholder="Your Email">
                </div>
                
                <div class="form-group">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </section>
    </main>

    <script src="BSCS-A 26041_script.js"></script>
</body>
</html>
